ey Deutch (Nouvelle Vague) and Academy Award® nominee and comedy iconoclast Trey Parker, co-creator of South Park. The cast also includes Saturday Night Live alum Bobby Moynihan and Phil LaMarr (Futurama, King of the Hill).\n\nMinions \u0026 Monsters is directed by Academy Award® nominee Pierre Coffin, a director of the first three Despicable Me films and the first Minions film. Coffin has also provided the voice for the Minions since their film debut in 2010. The film is written by Brian Lynch (Minions, The Secret Life of Pets films) and Pierre Coffin and is produced by Illumination’s Academy Award® nominated founder and CEO Chris Meledandri and by Bill Ryan (executive producer, The Super Mario Bros. Movie). The executive producer is Brian Lynch.\n\nMore than ten years after their creation, the Minions have become the most iconic animated characters of their generation. Globally recognized and beloved by fans of all ages, they have propelled Illumination’s Despicable Me and Minions to a global box office of more than $5.6 billion.","Studio":"Universal Film Exchange","GraphicUrl":"","DigitalTitle":null,"TrailerUrl":"","TwitterTag":"","Actors":[],"Directors":["Pierre Coffin"],"GenrePrimary":"Animated","GenreSecondary":"Comedy","Media":[{"Id":239488,"Type":"Video","SubType":"Trailer_Youtube","Url":"https://youtu.be/cahxX3oQqM8","SecureUrl":"https://youtu.be/cahxX3oQqM8","Title":null,"Description":null,"DimensionHeight":null,"DimensionWidth":null,"Format":"m3u8","MovieCode":"HO00020906","FileSize":null},{"Id":239491,"Type":"Image","SubType":"Mobile_MovieFeed","Url":"https://regalcdn.azureedge.net/REG/MinionsMonsters/HO00020906/Mobile_MovieFeed/20260209-153147663.png","SecureUrl":"https://regalcdn.azureedge.net/REG/MinionsMonsters/HO00020906/Mobile_MovieFeed/20260209-153147663.png","Title":null,"Description":null,"DimensionHeight":"400","DimensionWidth":"640","Format":"png","MovieCode":"HO00020906","FileSize":"431537"},{"Id":241052,"Type":"Image","SubType":"TV_SmallPost original Queens are back and hitting the big screen. See SIX The Musical Live! exclusively in UK and Ireland cinemas from Sunday 6th April 2025.\n\nWinner of over 35 awards, experience the best of British Musical HER-story in a live capture of the must-see musical sensation, SIX the Musical. The Original West End cast reunite at London’s Vaudeville Theatre in front of a sold-out audience to strut their stuff and re-write their Tudor traumas in an unmissable cinematic recording of the show packed full of style, sass, and sensational songs.\n\nWatched by audiences of over 3.5 million, SIX the Musical, has become a global theatre phenomenon since it’s 2017 debut at Edinburgh Festival Fringe, where it has redefined the boundaries of musical theatre. The show tells the extraordinary story of the six wives of King Henry VIII, who step out of the shadow of their infamous husband and reclaim their own narratives.\n\nWritten by Toby Marlow and Lucy Moss, the pop-inspired musical brings the queens - Catherine of Aragon (Jarnéia Richard-Noel), Anne Boleyn (Millie O'Connell), Jane Seymour (Natalie Paris), Anne of Cleves (Alexia McIntosh), Katherine Howard (Aimie Atkinson), and Catherine Parr (Maiya Quansah-Breed) — right into the 21st century with infectious, empowering performances, accompanied by the on-stage band, the Ladies in Waiting","Studio":"Focus Features","GraphicUrl":"","DigitalTitle":null,"TrailerUrl":"","TwitterTag":"","Actors":["Jarnéia Richard-Noel","Millie O'Connell","Natalie Paris","Alexia McIntosh","Aimie Atkinson","Maiya Quansah-Breed"],"Directors":[],"GenrePrimary":"Musical","GenreSecondary":null,"Media":[{"Id":241210,"Type":"Image","SubType":"TV_SmallPosterImage","Url":"https://regalcdn.azureedge.net/REG/SixTheMusicalLive/HO00021609/TV_SmallPosterImage/20260522-122456428.jpg","SecureUrl":"https://regalcdn.azureedge.net/REG/SixTheMusicalLive/HO00021609/TV_SmallPosterImage/20260522-122456428.jpg","Title":null,"Description":null,"DimensionHeight":"376","Dimens pace to a spot in the crowd of nearly 40,000 who witnessed those darkly magical nights in September","LongDescription":"Captured live over the course of GHOST’s two sold-out shows at Mexico City’s Palacio de los Deportes, 2 BIG TO RIG transports the viewer through time and space to a spot in the crowd of nearly 40,000 who witnessed those darkly magical nights in September 2025.\n\nUnlike GHOST’s previous feature film, RITE HERE RITE NOW, 2 BIG TO RIG focuses exclusively on the GHOST live ritual. From behind-the-scenes interludes showcasing the crew members that make the band’s theatrical vision into nightly reality to the only pro-shot footage of mesmerizing frontman Papa V Perpetua and his band of Nameless Ghouls on the entire phone-free tour, 2 BIG TO RIG is the definitive document of GHOST’s unforgettable SKELETOUR WORLD TOUR, presented in IMAX® in select locations.\n\nThe title 2 BIG TO RIG is a reference to GHOST ending SKELETOUR in February 2026 after 70 shows across North America, Europe, and Mexico. The film was made with the intention to share the SKELETOUR experience with the faithful in the territories where staging the show was not logistically feasible — as well as for the fans featured in the film who had tickets for the first of three planned Mexico City dates, which became two after night one was canceled due to illness.\n\n2 BIG TO RIG is a love letter to all those who have shared the GHOST ritual, in-person or otherwise. Shot on 16mm film, the feature-length concert film is both a must for those looking to relive their SKELETOUR memories and for those witnessing the spectacle for the first time. The charismatic Papa V and his troupe of bedazzled ghouls have never looked or sounded better than they do here, ripping through material from GHOST’s six albums — including 2025’s global #1 SKELETÁ as well as non-LP favorites including “Mary On A Cross,” “Kiss the Go-Goat,” and “The Future is a Foreign Land.\"\n","Studio":"Trafalgar Releasing, Ltd","Graphi

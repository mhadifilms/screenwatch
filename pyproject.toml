[project]
name = "screenwatch"
version = "0.1.0"
description = "Ranked cinema showtime search across formats, chains and independents"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "mcp>=1.2",
    "pydantic>=2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
screenwatch-mcp = "screenwatch.mcp.server:main"
screenwatch-scheduler = "screenwatch.service.scheduler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screenwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
